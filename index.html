<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GESTOR DE TAREAS UNIVERSITARIAS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
    
    <!-- Encabezado con Logos (UNSA y EPIS) -->
    <div class="header-container">
      <div class="logos-wrapper">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTr37VQ6RN0WTZ5OUAOp_e6h7x72UBEcA-bMMLkT5AAFQ&s=10" alt="Escudo UNSA" class="logo-img logo-unsa">
        <img src="https://images.seeklogo.com/logo-png/26/2/episunsa-logo-png_seeklogo-264078.png" alt="Logo EPIS UNSA" class="logo-img logo-epis">
      </div>
    </div>

  <main class="container app-shell">
    <header class="titulo-container">
      <h1 class="titulo-principal">GESTOR DE TAREAS UNIVERSITARIAS</h1>
      <p class="subtitulo" id="resumen" aria-live="polite">Aún no tienes tareas registradas</p>
    </header>

    <!-- Formulario de alta -->
    <section class="card card-body mb-3" aria-labelledby="titulo-form">
      <h2 class="h5" id="titulo-form">Nueva tarea</h2>

      <!-- Contenedor de alertas dinámicas -->
      <div id="alertas" role="alert"></div>

      <form id="tarea-form" novalidate>
        <div class="row g-3">
          <div class="col-12 col-md-5">
            <label for="titulo" class="form-label">Título</label>
            <input type="text" id="titulo" class="form-control" placeholder="ej. Informe del laboratorio">
          </div>
          <div class="col-12 col-md-4">
            <label for="curso" class="form-label">Curso</label>
            <input type="text" id="curso" class="form-control" placeholder="ej. Introducción al Desarrollo Web">
          </div>
          <div class="col-12 col-md-3">
            <label for="fechaEntrega" class="form-label">Fecha de entrega</label>
            <input type="date" id="fechaEntrega" class="form-control">
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Agregar tarea</button>
      </form>
    </section>

    <!-- Filtros -->
    <div class="btn-group mb-3" role="group" aria-label="Filtrar tareas" id="filtros">
      <button type="button" class="btn btn-outline-primary active" data-filtro="todas">Todas</button>
      <button type="button" class="btn btn-outline-primary" data-filtro="pendientes">Pendientes</button>
      <button type="button" class="btn btn-outline-primary" data-filtro="completadas">Completadas</button>
    </div>

    <!-- Lista -->
    <ul class="list-group" id="lista-tareas"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
